<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>进程管理</title>
<script src="/ui/stbox.js"></script>
<style>
  :root { --bg:#202124; --bg2:#2a2c31; --card:#26282d; --border:#000000;
          --text:#ffffff; --dim:#9aa0ab; --accent:#4f8cff;
          --green:#43d17e; --amber:#f0b34b; --red:#ef5a5a;
          --hover1:#2c2f34; --btn:#32353c; --btn-hover:#3a3e46;
          --btn2:#2a2d33; --btn2-hover:#33373e; --item-hover:#2b2e34;
          --code-bg:#15161a; --item-bg:#23252a; --log-text:#d4d7de;
          --pill-bg:rgba(0,0,0,.78); --pill-text:#ffffff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
         font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;
         transition:background .2s,color .2s; }
  .wrap { padding:14px 18px; max-width:1200px; }
  h1 { font-size:17px; font-weight:600; margin-bottom:2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .stats { color:var(--dim); font-size:12px; margin-left:auto; }
  .stats b { color:var(--text); }
  input[type=text] { background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:7px; padding:6px 9px; font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  input.search { width:210px; }
  .chk { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--dim);
         cursor:pointer; user-select:none; }
  button { border:0; border-radius:8px; padding:6px 13px; font:inherit; cursor:pointer;
           color:#fff; background:var(--accent); transition:filter .15s; white-space:nowrap; }
  button:hover { filter:brightness(1.12); }
  button.sec { background:var(--btn2); color:var(--text); border:1px solid var(--border); }
  button.sec:hover { background:var(--btn2-hover); filter:none; }
  button.danger { background:color-mix(in srgb, var(--red) 22%, transparent); color:var(--red); }
  button.danger:hover { background:color-mix(in srgb, var(--red) 32%, transparent); filter:none; }
  button.small { padding:2px 8px; font-size:12px; border-radius:6px; }
  /* ---- 磁贴网格：两列，上下对齐 ---- */
  .grid { display:grid; grid-template-columns: 1.16fr 1fr; gap:12px; }
  .tile { background:var(--card); border:1px solid var(--border);
          border-radius:12px; overflow:hidden; display:flex; flex-direction:column; min-width:0; }
  .tile-h { display:flex; align-items:center; gap:7px; padding:7px 12px;
            border-bottom:1px solid var(--border); color:var(--dim);
            font-size:12px; font-weight:500; }
  .tile-h .ic { color:var(--accent); font-size:13px; }
  .tile-h .cnt { margin-left:auto; color:var(--dim); font-weight:400; }
  .tile-h .cnt b { color:var(--text); }
  .tile-h button { margin-left:auto; }
  .tile-b { padding:6px 8px; flex:1; overflow:auto; }
  /* ---- 左侧列表 ---- */
  .col-list .tile-b { max-height:44vh; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border);
          white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:12px; cursor:pointer;
       user-select:none; position:sticky; top:0; background:var(--card); z-index:1; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  tbody tr.sel { background:color-mix(in srgb, var(--accent) 22%, transparent);
                 box-shadow:inset 3px 0 0 var(--accent); }
  tbody tr.sus { background:color-mix(in srgb, var(--amber) 8%, transparent); }
  tbody tr.sus.sel { background:color-mix(in srgb, var(--amber) 20%, transparent);
                     box-shadow:inset 3px 0 0 var(--amber); }
  td.num { font-variant-numeric:tabular-nums; text-align:right; }
  td.name { max-width:190px; overflow:hidden; text-overflow:ellipsis; }
  .badge { font-size:10px; padding:0 5px; border-radius:4px; margin-left:5px; }
  .badge.sus { background:color-mix(in srgb, var(--amber) 15%, transparent); color:var(--amber); }
  .badge.self { background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent); }
  /* ---- 右侧详情 ---- */
  .col-detail .tile-b { padding:10px 12px; }
  .empty-hint { color:var(--dim); padding:22px 10px; text-align:center; font-size:12.5px; }
  .kv { display:grid; grid-template-columns: 86px 1fr; gap:3px 10px; font-size:12.5px; }
  .kv .k { color:var(--dim); }
  .kv .v { color:var(--text); word-break:break-all; }
  .kv .v.mono { font-family:Consolas,monospace; font-size:12px; }
  .act { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .act button { padding:7px 16px; }
  .op-wrap { display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); border-radius:8px; padding:4px 8px;
    background:var(--bg2); }
  .op-lbl { color:var(--dim); font-size:12px; }
  /* ---- 日志磁贴（左列，不占整行） ---- */
  .col-log .tile-b { max-height:19vh; padding:4px 8px; }
  .logbox { font-size:11.8px; line-height:1.7; }
  .logline { display:flex; gap:8px; align-items:baseline; padding:1px 2px;
             border-bottom:1px dashed color-mix(in srgb, var(--border) 55%, transparent); }
  .logline:last-child { border-bottom:none; }
  .logline .t { color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .logline .a { color:var(--accent); white-space:nowrap; }
  .logline .o { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logline .r { margin-left:auto; color:var(--green); white-space:nowrap; }
  .logline .r.fail { color:var(--red); }
  .log-empty { color:var(--dim); padding:10px; text-align:center; font-size:12px; }
  /* ---- 统计磁贴（右列） ---- */
  .col-stats .tile-b { padding:10px 12px; }
  .stat-row { display:flex; justify-content:space-between; padding:3px 2px;
              font-size:12.5px; border-bottom:1px dashed
              color-mix(in srgb, var(--border) 55%, transparent); }
  .stat-row:last-child { border-bottom:none; }
  .stat-row .k { color:var(--dim); }
  .stat-row .v { color:var(--text); font-variant-numeric:tabular-nums; }
  .stat-row .v.g { color:var(--green); }
  .stat-row .v.a { color:var(--amber); }
  .stat-row .v.b { color:var(--accent); }
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45);
                display:none; align-items:center; justify-content:center; z-index:10; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:12px;
           padding:16px 18px; width:440px; max-width:92vw; }
  .modal h3 { font-size:14px; margin-bottom:12px; }
  .modal label.f { display:block; margin-bottom:9px; }
  .modal label.f span { display:block; color:var(--dim); font-size:12px; margin-bottom:3px; }
  .modal .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .empty { color:var(--dim); padding:20px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>进程管理</h1>
  <div class="sub">点击列表选中进程 · 操作在右侧 · 结束/挂起/恢复/启动/优先级/CPU亲和性为审批接口，保护系统关键进程与本软件</div>

  <div class="bar">
    <button id="btnRefresh">↻ 刷新</button>
    <label class="chk"><input type="checkbox" id="auto"> 自动刷新(3s)</label>
    <label class="chk"><input type="checkbox" id="full"> 显示路径/内存/优先级/亲和性</label>
    <input type="text" id="search" class="search" placeholder="按名称 / PID 过滤…">
    <button id="btnStart">▶ 启动进程</button>
  </div>

  <div class="grid">
    <!-- 左侧：进程列表 -->
    <div class="tile col-list">
      <div class="tile-h"><span class="ic">▤</span>进程列表
        <span class="cnt">共 <b id="stTotal">0</b> · 显示 <b id="stShow">0</b></span></div>
      <div class="tile-b">
        <table>
          <thead><tr>
            <th data-k="name">名称</th>
            <th data-k="pid" class="num">PID</th>
            <th data-k="mem" class="num">内存</th>
            <th data-k="threads" class="num">线程</th>
            <th style="width:64px">状态</th>
          </tr></thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>

    <!-- 右侧：选中进程详情 + 操作 -->
    <div class="tile col-detail">
      <div class="tile-h"><span class="ic">ℹ</span>选中进程 <span class="cnt" id="detName"></span></div>
      <div class="tile-b">
        <div class="empty-hint" id="detEmpty">← 点击左侧列表选中一个进程</div>
        <div id="detBody" style="display:none">
          <div class="kv" id="detKv"></div>
          <div class="act" id="detAct"></div>
        </div>
      </div>
    </div>

    <!-- 左下：操作日志磁贴（不占整行，与列表列对齐） -->
    <div class="tile col-log">
      <div class="tile-h"><span class="ic">📜</span>操作日志
        <button class="small sec" id="logClear">清空</button></div>
      <div class="tile-b logbox" id="logBox"></div>
    </div>

    <!-- 右下：统计磁贴（与详情列对齐） -->
    <div class="tile col-stats">
      <div class="tile-h"><span class="ic">◈</span>统计</div>
      <div class="tile-b" id="statsBox"></div>
    </div>
  </div>
</div>

<div class="modal-mask" id="mask">
  <div class="modal">
    <h3>启动新进程</h3>
    <label class="f"><span>程序路径 *</span>
      <input type="text" id="sPath" placeholder="如 C:\Windows\System32\notepad.exe" style="width:100%"></label>
    <label class="f"><span>命令行参数</span>
      <input type="text" id="sArgs" style="width:100%"></label>
    <label class="f"><span>工作目录（可选）</span>
      <input type="text" id="sWork" style="width:100%"></label>
    <div class="btns">
      <button class="sec" id="sCancel">取消</button>
      <button id="sOk">启动</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);
  const PID = "procman";
  let procs = [];
  let selPid = null;          // 当前选中 PID
  let sortKey = "pid", sortAsc = true;
  const logs = [];            // 操作日志（前端本地记录）
  const ACT = { kill:"结束进程", suspend:"挂起", resume:"恢复", start:"启动进程" };

  function now(){ const d = new Date();
    return String(d.getHours()).padStart(2,"0") + ":" +
           String(d.getMinutes()).padStart(2,"0") + ":" +
           String(d.getSeconds()).padStart(2,"0"); }

  function addLog(action, target, ok, detail){
    logs.unshift({ t: now(), a: action, o: target, ok: !!ok, d: detail || "" });
    if (logs.length > 60) logs.pop();
    renderLog();
  }

  function renderLog(){
    const box = $("logBox");
    box.innerHTML = "";
    if (!logs.length){
      box.innerHTML = '<div class="log-empty">暂无操作记录</div>';
      return;
    }
    logs.forEach((l)=>{
      const div = stbox.el("div", { class:"logline" });
      div.appendChild(stbox.el("span", { class:"t", text: l.t }));
      div.appendChild(stbox.el("span", { class:"a", text: l.a }));
      div.appendChild(stbox.el("span", { class:"o", text: l.o + (l.d ? " — " + l.d : "") }));
      div.appendChild(stbox.el("span", { class:"r" + (l.ok ? "" : " fail"),
        text: l.ok ? "✓ 成功" : "✗ 失败" }));
      box.appendChild(div);
    });
    box.scrollTop = 0;
  }

  function renderStats(){
    const full = $("full").checked;
    const arr = visible();
    const susp = arr.filter((p)=>p.suspended).length;
    const rows = [
      ["进程总数", procs.length, ""],
      ["当前显示", arr.length, "b"],
      ["其中挂起", susp, "a"],
      ["路径/内存列", full ? "显示" : "隐藏", ""],
    ];
    $("statsBox").innerHTML = rows.map((r)=>
      '<div class="stat-row"><span class="k">' + r[0] + '</span>' +
      '<span class="v ' + r[2] + '">' + r[1] + '</span></div>').join("");
  }

  async function load(){
    const full = $("full").checked;
    const r = await stbox.rpc(PID, "list", { full });
    if (!r.ok) return;
    procs = r.data.processes || [];
    $("stTotal").textContent = r.data.total;
    render();
  }

  function visible(){
    const q = $("search").value.trim().toLowerCase();
    if (!q) return procs;
    return procs.filter((p)=>
      p.name.toLowerCase().includes(q) || String(p.pid).includes(q));
  }

  function selected(){
    return procs.find((p)=>p.pid === selPid) || null;
  }

  function renderDetail(){
    const p = selected();
    if (!p){
      $("detEmpty").style.display = "";
      $("detBody").style.display = "none";
      $("detName").textContent = "";
      return;
    }
    $("detEmpty").style.display = "none";
    $("detBody").style.display = "";
    $("detName").textContent = p.name + " (PID " + p.pid + ")";
    const full = $("full").checked;
    const kv = [
      ["名称", p.name],
      ["PID", String(p.pid)],
      ["父PID", String(p.parentPid)],
      ["线程数", String(p.threads)],
      ["内存", p.mem == null ? "-" : stbox.fmtBytes(p.mem)],
      ["优先级", p.priorityName == null ? "-" : p.priorityName],
      ["CPU亲和", p.affinity == null ? "-" :
        "0x" + Number(p.affinity).toString(16).toUpperCase() +
        (p.numCpus ? "（共" + p.numCpus + "核）" : "")],
      ["路径", p.path || (full ? "-" : "（开启「显示路径/内存/优先级/亲和性」后可见）")],
      ["状态", p.suspended ? "已挂起" : "正常"],
    ];
    const box = $("detKv");
    box.innerHTML = "";
    kv.forEach(([k,v])=>{
      box.appendChild(stbox.el("div", { class:"k", text: k }));
      const vd = stbox.el("div", { class:"v" + (k === "路径" ? " mono" : ""), text: v });
      box.appendChild(vd);
    });
    // 操作按钮（右侧）
    const act = $("detAct");
    act.innerHTML = "";
    act.appendChild(stbox.el("button", { class:"danger", text:"结束进程",
      onclick: ()=>{ if (confirm("确定结束进程「" + p.name + "」(PID " + p.pid + ")？"))
        doAdmin("kill", { pid: p.pid }, ACT.kill, p.name + " (PID " + p.pid + ")"); }}));
    act.appendChild(stbox.el("button", { class:"sec", text: p.suspended ? "恢复进程" : "挂起进程",
      onclick: ()=> doAdmin(p.suspended ? "resume" : "suspend", { pid: p.pid },
        p.suspended ? ACT.resume : ACT.suspend, p.name + " (PID " + p.pid + ")") }));
    // 优先级下拉
    if (p.priorityName != null){
      const sel = document.createElement("select");
      sel.style.background = "var(--bg2)"; sel.style.color = "var(--text)";
      sel.style.border = "1px solid var(--border)"; sel.style.borderRadius = "7px";
      sel.style.padding = "4px 6px"; sel.style.fontSize = "12px";
      ["低","低于标准","标准","高于标准","高","实时"].forEach((n)=>{
        const op = document.createElement("option");
        op.value = n; op.textContent = n;
        if (n === p.priorityName) op.selected = true;
        sel.appendChild(op);
      });
      const priBtn = stbox.el("button", { class:"sec small", text:"设优先级",
        onclick: ()=> doAdmin("priority", { pid: p.pid, priority: sel.value },
          "优先级→" + sel.value, p.name + " (PID " + p.pid + ")") });
      const wrap = stbox.el("span", { class:"op-wrap" });
      wrap.appendChild(stbox.el("span", { class:"op-lbl", text:"优先级 " }));
      wrap.appendChild(sel); wrap.appendChild(priBtn);
      act.appendChild(wrap);
    }
    // CPU 亲和性输入
    if (p.affinity != null){
      const inp = document.createElement("input");
      inp.type = "text"; inp.value = "0x" + Number(p.affinity).toString(16).toUpperCase();
      inp.style.width = "90px"; inp.style.background = "var(--bg2)";
      inp.style.color = "var(--text)"; inp.style.border = "1px solid var(--border)";
      inp.style.borderRadius = "7px"; inp.style.padding = "4px 6px";
      inp.style.fontSize = "12px"; inp.style.fontFamily = "Consolas,monospace";
      const affBtn = stbox.el("button", { class:"sec small", text:"设亲和性",
        onclick: ()=> doAdmin("affinity", { pid: p.pid, mask: inp.value.trim() },
          "亲和性→" + inp.value.trim(), p.name + " (PID " + p.pid + ")") });
      const wrap2 = stbox.el("span", { class:"op-wrap" });
      wrap2.appendChild(stbox.el("span", { class:"op-lbl", text:"CPU " }));
      wrap2.appendChild(inp); wrap2.appendChild(affBtn);
      act.appendChild(wrap2);
    }
  }

  function render(){
    const tb = $("tb");
    tb.innerHTML = "";
    const arr = visible().slice();
    arr.sort((a,b)=>{
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === "mem"){ va = va==null?-1:va; vb = vb==null?-1:vb; }
      else if (sortKey === "pid" || sortKey === "threads"){
        va = Number(va)||0; vb = Number(vb)||0;
      } else { va = String(va||"").toLowerCase(); vb = String(vb||"").toLowerCase(); }
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
    $("stShow").textContent = arr.length;
    if (!arr.length){
      tb.innerHTML = '<tr><td colspan="5"><div class="empty">（无匹配进程）</div></td></tr>';
      renderStats();
      renderDetail();
      return;
    }
    const full = $("full").checked;
    const selfPids = new Set(procs.filter((p)=>/SystemToolBox/i.test(p.name)).map((p)=>p.pid));
    arr.forEach((p)=>{
      const tr = stbox.el("tr");
      if (p.pid === selPid) tr.className = "sel";
      if (p.suspended) tr.className += (tr.className ? " " : "") + "sus";
      tr.onclick = ()=>{ selPid = p.pid; render(); renderDetail(); };
      const nameTd = stbox.el("td", { class:"name" });
      nameTd.appendChild(stbox.el("span",{ text: p.name }));
      if (p.suspended) nameTd.appendChild(stbox.el("span",{ class:"badge sus", text:"挂起" }));
      if (selfPids.has(p.pid)) nameTd.appendChild(stbox.el("span",{ class:"badge self", text:"本软件" }));
      tr.appendChild(nameTd);
      tr.appendChild(stbox.el("td", { class:"num", text:String(p.pid) }));
      tr.appendChild(stbox.el("td", { class:"num", text: p.mem==null ? "-" : stbox.fmtBytes(p.mem) }));
      tr.appendChild(stbox.el("td", { class:"num", text:String(p.threads) }));
      tr.appendChild(stbox.el("td", { class:"num",
        text: p.suspended ? "已挂起" : (full ? (p.path ? "运行中" : "-") : "运行中") }));
      tb.appendChild(tr);
    });
    renderStats();
    renderDetail();
  }

  async function doAdmin(api, args, action, target){
    let ok = false, detail = "";
    try{
      const r = await stbox.rpcWithApproval(PID, api, args, { onPending:()=>{} });
      ok = !!r.ok;
      if (!r.ok) detail = "[" + (r.error && r.error.code) + "] " + (r.error && r.error.message);
    }catch(e){ detail = String(e.message || e); }
    addLog(action, target, ok, detail);
    if (!ok) alert("[" + (detail || "未知错误") + "]");
    await load();
  }

  $("btnRefresh").onclick = load;
  $("auto").onchange = ()=>{
    clearInterval(window.__auto);
    if ($("auto").checked) window.__auto = setInterval(load, 3000);
  };
  $("full").onchange = ()=>{ load(); renderDetail(); };
  $("search").oninput = ()=>{ render(); };
  $("btnStart").onclick = ()=> $("mask").style.display = "flex";
  $("sCancel").onclick = ()=> $("mask").style.display = "none";
  $("sOk").onclick = async ()=>{
    const path = $("sPath").value.trim();
    if (!path){ alert("请填写程序路径"); return; }
    $("mask").style.display = "none";
    await doAdmin("start", { path, args: $("sArgs").value, workdir: $("sWork").value.trim() },
      ACT.start, path);
    $("sPath").value = ""; $("sArgs").value = ""; $("sWork").value = "";
  };
  $("mask").onclick = (e)=>{ if (e.target === $("mask")) $("mask").style.display = "none"; };
  $("logClear").onclick = ()=>{ logs.length = 0; renderLog(); };
  document.querySelectorAll("th").forEach((th)=>{
    th.onclick = ()=>{
      const k = th.dataset.k;
      if (!k) return;
      if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
      render();
    };
  });

  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
