<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>系统信息叠加层</title>
<script src="/ui/stbox.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; user-select: none;
    font: 11px/1.3 "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  /* 半透明底板：背景透明度随后端 state.opacity 动态更新（--bg-a） */
  .overlay {
    position: fixed; inset: 0;
    border-radius: 10px; overflow: hidden;
    background: rgba(16, 18, 24, var(--bg-a, 0.78));
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    color: #e8eaf0;
    display: flex; flex-direction: column;
  }
  .head {
    -webkit-app-region: drag;          /* 拖拽移动窗口 */
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px; font-size: 11px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex: 0 0 auto;
  }
  .head .dot { width:7px; height:7px; border-radius:50%;
               background:#43d17e; box-shadow:0 0 4px #43d17e; }
  .head .title { font-weight:600; letter-spacing:.5px; }
  .head .spacer { flex:1; -webkit-app-region: no-drag; }
  .badge { font-size:10px; padding:0 6px; border-radius:99px;
           background:rgba(240,179,75,.16); color:#f0b34b; display:none; }
  .badge.on { display:inline-block; }
  .head button {
    -webkit-app-region: no-drag; border:0; cursor:pointer;
    background:rgba(255,255,255,0.10); color:#cfd3dc;
    border-radius:5px; font-size:10px; line-height:1; padding:3px 7px;
  }
  .head button:hover { background:rgba(255,255,255,0.22); }
  .head button.close:hover { background:rgba(239,90,90,.75); color:#fff; }

  /* 每指标独立小面板：grid 2 列，最后一行下行/上行各占 1 格 */
  .grid {
    flex:1; min-height:0; display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px; padding: 2px;
    grid-auto-rows: 1fr;
  }
  .cell {
    position: relative; min-width:0; min-height:0;
    border-radius: 5px; overflow: hidden;
    background: rgba(255,255,255,0.03);
  }
  .cell .cap {
    position: absolute; left:5px; top:2px; z-index:2; pointer-events:none;
    font-size:10px; color: rgba(255,255,255,0.75);
    display:flex; gap:6px; align-items:baseline;
    white-space:nowrap; max-width:92%; overflow:hidden;
  }
  .cell .cap .n { font-weight:600; }
  .cell .cap .v { font-weight:700; font-size:11px;
                  font-variant-numeric:tabular-nums; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
</style>
</head>
<body>
<div class="overlay" id="ov">
  <div class="head">
    <span class="dot"></span>
    <span class="title">系统信息</span>
    <span class="spacer"></span>
    <span class="badge" id="passBadge">鼠标穿透</span>
    <button id="btnClose" title="关闭叠加层">✕</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function () {
  "use strict";
  var ov = document.getElementById("ov");

  // 每指标独立面板：key 对应 history 采样字段
  var DEFS = [
    { key: "cpu",   label: "CPU",  color: "#f0533a", unit: "%",    pct: true },
    { key: "mem",   label: "内存", color: "#43d17e", unit: "%",    pct: true },
    { key: "disk",  label: "磁盘", color: "#4f8cff", unit: "%",    pct: true },
    { key: "netRx", label: "↓ 下行", color: "#b07cf0", unit: "KB/s", pct: false },
    { key: "netTx", label: "↑ 上行", color: "#f0b34b", unit: "KB/s", pct: false },
  ];
  var cells = [];       // {key,label,color,unit,pct, cv, ctx, vEl}
  var refreshMs = 1000; // 从后端 state 读取的自定义刷新率
  var samples = [];

  // 构建面板
  var grid = document.getElementById("grid");
  DEFS.forEach(function (d) {
    var cell = document.createElement("div");
    cell.className = "cell";
    var cap = document.createElement("div");
    cap.className = "cap";
    cap.innerHTML = '<span class="n" style="color:' + d.color + '">' +
      d.label + '</span><span class="v" id="val-' + d.key + '">-</span>';
    var cv = document.createElement("canvas");
    cell.appendChild(cap);
    cell.appendChild(cv);
    grid.appendChild(cell);
    cells.push({
      key: d.key, label: d.label, color: d.color, unit: d.unit, pct: d.pct,
      cv: cv, ctx: cv.getContext("2d"),
      vEl: cap.querySelector(".v"),
      net: !d.pct,
    });
  });

  function resizeCell(c) {
    var r = c.cv.parentNode.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(10, Math.floor(r.width * dpr));
    var h = Math.max(10, Math.floor(r.height * dpr));
    if (c.cv.width !== w || c.cv.height !== h) {
      c.cv.width = w; c.cv.height = h;
      c.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function draw() {
    var n = samples.length;
    var t0 = n ? samples[n - 1].t - 20 : 0;   // 近 20s 窗口
    cells.forEach(function (c) {
      resizeCell(c);
      var cv = c.cv, ctx = c.ctx;
      var W = cv.width / (window.devicePixelRatio || 1);
      var H = cv.height / (window.devicePixelRatio || 1);
      ctx.clearRect(0, 0, W, H);
      if (W < 16 || H < 12) return;
      var pad = 2;
      var plotW = W - pad * 2, plotH = H - pad * 2;

      // 本面板序列（20s 窗口内）
      var pts = [], i;
      for (i = 0; i < n; i++) {
        var s = samples[i];
        if (s.t >= t0) pts.push(s[c.key]);
      }
      if (pts.length < 2) return;

      // y 轴：百分比面板固定 0-100；网络面板动态上限
      var yMax = c.pct ? 100 : 1;
      if (!c.pct) {
        for (i = 0; i < pts.length; i++) yMax = Math.max(yMax, pts[i]);
        yMax = yMax * 1.15;
      }
      var yAt = function (v) {
        return pad + plotH * (1 - Math.min(yMax, Math.max(0, v)) / yMax);
      };
      var xAt = function (idx) {
        return pad + plotW * idx / (pts.length - 1);
      };

      // 网络面板虚线网格（动态），百分比面板 25/50/75 淡线
      ctx.lineWidth = 1;
      if (c.pct) {
        ctx.strokeStyle = "rgba(255,255,255,0.07)";
        [25, 50, 75].forEach(function (g) {
          var y = yAt(g);
          ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad + plotW, y);
          ctx.stroke();
        });
      } else {
        ctx.strokeStyle = "rgba(255,255,255,0.07)";
        [0.25, 0.5, 0.75].forEach(function (g) {
          var y = pad + plotH * (1 - g);
          ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad + plotW, y);
          ctx.stroke();
        });
      }

      ctx.strokeStyle = c.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (i = 0; i < pts.length; i++) {
        if (i === 0) ctx.moveTo(xAt(i), yAt(pts[i]));
        else ctx.lineTo(xAt(i), yAt(pts[i]));
      }
      ctx.stroke();

      // 末点圆点 + 当前值
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.arc(xAt(pts.length - 1), yAt(pts[pts.length - 1]), 2, 0, 6.2832);
      ctx.fill();
      var lastV = pts[pts.length - 1];
      c.vEl.textContent = (c.pct ? lastV.toFixed(1) : lastV.toFixed(0)) +
                          " " + c.unit;
    });
  }

  function applyState(s) {
    if (!s) return;
    var a = Math.max(0.08, Math.min(1, Number(s.opacity) || 0.78));
    document.documentElement.style.setProperty("--bg-a", String(a));
    var b = document.getElementById("passBadge");
    if (s.passthrough) b.classList.add("on"); else b.classList.remove("on");
    if (s.refreshMs && s.refreshMs >= 100 && s.refreshMs <= 20000) {
      refreshMs = s.refreshMs;
    }
  }

  // 主进程下推通道（preload 注入）：滑块拖动时透明度即时生效，无需等轮询
  if (window.stbOv && window.stbOv.onCfg) {
    window.stbOv.onCfg(function (cfg) {
      if (cfg && cfg.opacity != null) {
        document.documentElement.style.setProperty(
          "--bg-a", String(Math.max(0.08, Math.min(1, Number(cfg.opacity)))));
      }
    });
  }

  async function pollState() {
    try {
      var st = await stbox.rpc("overlay", "state", {});
      if (st && st.ok) applyState(st.data);
    } catch (e) { /* ignore */ }
  }

  async function pollHistory() {
    try {
      var h = await stbox.rpc("overlay", "history", {});
      if (h && h.ok && Array.isArray(h.data.samples)) {
        samples = h.data.samples;
        draw();
      }
    } catch (e) { /* ignore */ }
  }

  function schedule() {
    setTimeout(function () {
      pollState();
      pollHistory();
      schedule();
    }, refreshMs);
  }

  document.getElementById("btnClose").addEventListener("click", function () {
    stbox.rpc("overlay", "set", { enabled: false }).catch(function () {});
  });

  window.addEventListener("resize", function () { draw(); });
  pollState();
  pollHistory();
  schedule();          // 以自定义刷新率持续更新
})();
</script>
</body>
</html>
