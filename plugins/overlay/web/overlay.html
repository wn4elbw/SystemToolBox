<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>系统信息叠加层</title>
<script src="/ui/stbox.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; user-select: none;
    font: 12px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  /* 半透明底板：背景透明度随后端 state.opacity 动态更新（#overlay 的 --bg-a） */
  .overlay {
    position: fixed; inset: 0;
    border-radius: 10px; overflow: hidden;
    background: rgba(16, 18, 24, var(--bg-a, 0.78));
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    color: #e8eaf0;
    display: flex; flex-direction: column;
  }
  .head {
    -webkit-app-region: drag;          /* 拖拽移动窗口 */
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px; font-size: 11px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex: 0 0 auto;
  }
  .head .dot { width:7px; height:7px; border-radius:50%;
               background:#43d17e; box-shadow:0 0 4px #43d17e; }
  .head .title { font-weight:600; letter-spacing:.5px; }
  .head .spacer { flex:1; -webkit-app-region: no-drag; }
  .badge { font-size:10px; padding:0 6px; border-radius:99px;
           background:rgba(240,179,75,.16); color:#f0b34b; display:none; }
  .badge.on { display:inline-block; }
  .head button {
    -webkit-app-region: no-drag; border:0; cursor:pointer;
    background:rgba(255,255,255,0.10); color:#cfd3dc;
    border-radius:5px; font-size:10px; line-height:1; padding:3px 7px;
  }
  .head button:hover { background:rgba(255,255,255,0.22); }
  .head button.close:hover { background:rgba(239,90,90,.75); color:#fff; }

  .chart-wrap { flex:1; position:relative; min-height:0; }
  canvas { display:block; width:100%; height:100%; }

  .legend {
    flex:0 0 auto; display:flex; flex-wrap:wrap; gap:2px 10px;
    padding:3px 8px 5px; font-size:10.5px; border-top:1px solid rgba(255,255,255,0.07);
  }
  .legend span { white-space:nowrap; }
  .sw { display:inline-block; width:8px; height:8px; border-radius:2px;
        margin-right:4px; vertical-align:-1px; }
  .v { font-weight:600; margin-left:2px; color:#fff; }
</style>
</head>
<body>
<div class="overlay" id="ov">
  <div class="head">
    <span class="dot"></span>
    <span class="title">系统信息</span>
    <span class="spacer"></span>
    <span class="badge" id="passBadge">鼠标穿透</span>
    <button id="btnClose" title="关闭叠加层">✕</button>
  </div>
  <div class="chart-wrap"><canvas id="cv"></canvas></div>
  <div class="legend" id="legend"></div>
</div>

<script>
(function () {
  "use strict";
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var ov = document.getElementById("ov");
  var legend = document.getElementById("legend");
  var SAMPLES = 20;

  var SERIES = [
    { key: "cpu",    label: "CPU",   color: "#f0533a", unit: "%" },
    { key: "mem",    label: "内存",  color: "#43d17e", unit: "%" },
    { key: "disk",   label: "磁盘",  color: "#4f8cff", unit: "%" },
    { key: "netRx",  label: "↓" ,    color: "#b07cf0", unit: "KB/s", net: true },
    { key: "netTx",  label: "↑",     color: "#f0b34b", unit: "KB/s", net: true },
  ];

  function resize() {
    var r = cv.parentNode.getBoundingClientRect();
    if (cv.width !== Math.floor(r.width) || cv.height !== Math.floor(r.height)) {
      var dpr = window.devicePixelRatio || 1;
      cv.width = Math.max(10, Math.floor(r.width * dpr));
      cv.height = Math.max(10, Math.floor(r.height * dpr));
      cv.style.width = r.width + "px";
      cv.style.height = r.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function draw(samples) {
    resize();
    var W = cv.width / (window.devicePixelRatio || 1);
    var H = cv.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, W, H);
    if (W < 20 || H < 20) return;

    var padL = 30, padR = 6, padT = 8, padB = 6;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    // 百分比轴 0-100
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.font = "9px Segoe UI";
    ctx.lineWidth = 1;
    for (var g = 0; g <= 4; g++) {
      var y = padT + plotH * g / 4;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y);
      ctx.stroke();
      ctx.fillText(String(100 - g * 25), 2, y + 3);
    }

    var n = Math.min(SAMPLES, samples.length);
    if (n < 2) return;
    // 取窗口内最近 n 个点
    var list = samples.slice(samples.length - n);

    // 网络动态上限（KB/s）
    var netMax = 1;
    list.forEach(function (s) { netMax = Math.max(netMax, s.netRx, s.netTx); });
    netMax = Math.max(1, netMax * 1.15);

    var xAt = function (i) { return padL + plotW * i / (n - 1); };
    var yPct = function (v) { return padT + plotH * (1 - Math.min(100, Math.max(0, v)) / 100); };
    var yNet = function (v) { return padT + plotH * (1 - Math.min(netMax, Math.max(0, v)) / netMax); };

    SERIES.forEach(function (s) {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (var i = 0; i < n; i++) {
        var y = s.net ? yNet(list[i][s.key]) : yPct(list[i][s.key]);
        if (i === 0) ctx.moveTo(xAt(i), y);
        else ctx.lineTo(xAt(i), y);
      }
      ctx.stroke();
      // 末点圆点
      var ly = s.net ? yNet(list[n - 1][s.key]) : yPct(list[n - 1][s.key]);
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(xAt(n - 1), ly, 2, 0, 6.2832); ctx.fill();
    });

    // 图例 + 当前值
    var last = list[n - 1];
    legend.innerHTML = "";
    SERIES.forEach(function (s) {
      var v = last[s.key];
      var txt = (s.net ? v.toFixed(0) : v.toFixed(1)) + " " + s.unit;
      var sp = document.createElement("span");
      sp.innerHTML = '<span class="sw" style="background:' + s.color + '"></span>' +
                     s.label + '<span class="v">' + txt + "</span>";
      legend.appendChild(sp);
    });
    document.title = "CPU " + last.cpu + "% | 内存 " + last.mem + "%";
  }

  function applyState(s) {
    if (!s) return;
    var a = Math.max(0.08, Math.min(1, Number(s.opacity) || 0.78));
    document.documentElement.style.setProperty("--bg-a", String(a));
    var b = document.getElementById("passBadge");
    if (s.passthrough) b.classList.add("on"); else b.classList.remove("on");
  }

  async function tick() {
    try {
      var h = await stbox.rpc("overlay", "history", {});
      if (h && h.ok && Array.isArray(h.data.samples)) draw(h.data.samples);
    } catch (e) { /* ignore */ }
    try {
      var st = await stbox.rpc("overlay", "state", {});
      if (st && st.ok) applyState(st.data);
    } catch (e) { /* ignore */ }
  }

  document.getElementById("btnClose").addEventListener("click", function () {
    stbox.rpc("overlay", "set", { enabled: false }).catch(function () {});
  });

  // 首次加载即绘制，随后每秒刷新（近 20s 数据由后端环形缓冲提供）
  tick();
  setInterval(tick, 1000);
  window.addEventListener("resize", function () { resize(); draw([]); });
})();
</script>
</body>
</html>
